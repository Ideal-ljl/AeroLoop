[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "uav-eval"
version = "0.1.0"
description = "Model-agnostic closed-loop evaluation for UAV navigation policies"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
authors = [{name = "UAVEval contributors"}]
keywords = ["UAV", "VLN", "VLA", "evaluation", "robotics"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = ["PyYAML>=5.4"]

[project.optional-dependencies]
media = ["numpy>=1.23", "opencv-python>=4.8"]
airbrain = ["numpy>=1.23", "opencv-python>=4.8", "open3d>=0.17"]
all = ["numpy>=1.23", "opencv-python>=4.8", "open3d>=0.17"]
dev = ["pytest>=7", "ruff>=0.5"]

[project.scripts]
uav-eval = "uav_eval.cli:main"
uav-model-server = "uav_eval.server_cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
uav_eval = ["resources/*.yaml"]

[tool.ruff]
line-length = 120
target-version = "py310"
