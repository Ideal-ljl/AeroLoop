[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "uav-eval"
version = "0.1.0"
description = "Model-agnostic closed-loop evaluation for UAV navigation policies"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["PyYAML>=5.4"]

[project.optional-dependencies]
airbrain = ["numpy", "opencv-python", "open3d"]
dev = ["pytest>=7", "ruff>=0.5"]

[project.scripts]
uav-eval = "uav_eval.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 120
target-version = "py310"
