[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aeroloop"
version = "0.1.0"
description = "Simulator-model interaction and data collection for UAV navigation"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
authors = [{name = "AeroLoop contributors"}]
keywords = ["UAV", "VLN", "VLA", "evaluation", "robotics"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = ["PyYAML>=5.4"]

[project.urls]
Homepage = "https://github.com/Ideal-ljl/AeroLoop"
Repository = "https://github.com/Ideal-ljl/AeroLoop"
Issues = "https://github.com/Ideal-ljl/AeroLoop/issues"

[project.optional-dependencies]
media = ["numpy>=1.23", "opencv-python>=4.8"]
airsim = ["numpy>=1.23", "airsim>=1.8.1"]
unrealcv = ["numpy>=1.23", "opencv-python>=4.8", "unrealcv>=1.1.6"]
simulators = ["numpy>=1.23", "opencv-python>=4.8", "airsim>=1.8.1", "unrealcv>=1.1.6"]
all = ["numpy>=1.23", "opencv-python>=4.8", "airsim>=1.8.1", "unrealcv>=1.1.6"]
dev = ["pytest>=7", "ruff>=0.5"]

[project.scripts]
aeroloop = "aeroloop.cli:main"
aeroloop-model-server = "aeroloop.server_cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
aeroloop = ["resources/*.yaml"]

[tool.ruff]
line-length = 120
target-version = "py310"
