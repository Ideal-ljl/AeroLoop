extends: ../models/omninav.yaml

benchmark:
  source: openfly
  kwargs:
    path: /mnt/petrelfs/youzhongrui/v2/Ab_ex/eval_data/openfly_airsim18_20/test_data_sim.json
    include_envs: env_airsim_18
    limit: 20

simulator:
  type: airsim
  kwargs:
    env_root: .runtime/envs/airsim
    launch_script: LinuxNoEditor/start.sh
    host: 127.0.0.1
    port: 41451
    cameras:
      - name: front
        width: 896
        height: 896
        fov: 90
    camera_names:
      front: front_custom
    vehicle_name: drone_1
    configure_camera_poses: false
    strict_camera_size: true
    position_sign: [1, -1, -1]
    yaw_sign: -1
    channel_order: bgr
    ignore_collision: false
    log_path: simulator.log

rollout:
  max_steps: 200
  execution_horizon: 1
  stop_threshold: 0.5
  terminate_on_collision: true
  execute_motion_on_stop: false

metrics:
  profile: openfly
  require_stop_for_success: false

output:
  jsonl: eval_results/omninav_openfly_env_airsim_18.jsonl
  include_steps: true

media:
  show_window: false
  save_video: false
  save_collision_frame: true
  collision_dir: eval_results/collisions/omninav_openfly_env_airsim_18
