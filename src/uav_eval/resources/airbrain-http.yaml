benchmark:
  source: airbrain
  eval_config: /path/to/AirBrain/dataset/eval.json
  repo_id: null
  max_samples: 100
environment:
  type: airbrain
  kwargs:
    airbrain_root: /path/to/AirBrain
    color_order: bgr
    collision_check: true
policy:
  type: http
  kwargs:
    url: http://127.0.0.1:18080/v1/predict
    reset_url: http://127.0.0.1:18080/v1/reset
    timeout_s: 120
rollout:
  max_steps: 200
  execution_horizon: 1
  stop_threshold: 0.5
  terminate_on_collision: true
metrics:
  success_distance: 25
  distance_mode: legacy_min
  require_stop_for_success: false
output:
  jsonl: eval_results/airbrain_http.jsonl
  include_steps: true
media:
  show_window: true
  overlay: true
  save_video: true
  video_dir: eval_results/videos
  video_fps: 10
  save_collision_frame: true
  collision_dir: eval_results/collisions
