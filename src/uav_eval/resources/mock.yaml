benchmark:
  source: inline
  episodes:
    - episode_id: straight-line-smoke
      env_name: mock
      instruction: Fly forward ten metres and stop.
      start_pose: [0, 0, 0, 0]
      target_position: [10, 0, 0]
      reference_path_length: 10
environment:
  type: mock
policy:
  type: mock
  kwargs:
    action: [1, 0, 0, 0, 0]
    chunk_size: 4
    stop_after: 10
rollout:
  max_steps: 20
  execution_horizon: 1
metrics:
  success_distance: 1.0
  distance_mode: endpoint_3d
  require_stop_for_success: true
output:
  jsonl: eval_results/mock.jsonl
  include_steps: true
media:
  show_window: false
  save_video: false
  save_collision_frame: false
